<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professor Passkey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; }
    </style>
</head>
<body class="min-h-screen flex flex-col theme-light">

    <!-- Theme Toggle -->
    <button id="theme-toggle" onclick="toggleTheme()" class="fixed top-4 right-4 p-2 rounded-full z-50 transition-colors shadow-md bg-gray-200 dark:bg-gray-800">
        <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-800" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-200 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9 9 0 008.354-5.646z" />
        </svg>
    </button>
    
    <!-- Auth Screen (Login/Register) -->
    <div id="auth-screen" class="flex items-center justify-center min-h-screen w-full fixed inset-0 z-40 bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
        <div class="w-full max-w-md p-8 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700">
            <h2 class="text-3xl font-bold text-center mb-2 text-indigo-600 dark:text-indigo-400">Welcome</h2>
            <p class="text-center text-gray-500 dark:text-gray-400 mb-8">Sign in to save your progress.</p>
            
            <form id="auth-form" class="space-y-4" onsubmit="handleAuth(event)">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
                <button type="submit" class="btn-primary w-full py-3 mt-4">Sign In / Register</button>
            </form>
            
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300 dark:border-gray-600"></div></div>
                <div class="relative flex justify-center text-sm"><span class="px-2 bg-white dark:bg-gray-800 text-gray-500">Or</span></div>
            </div>

            <button onclick="handleGuestLogin()" class="btn-secondary w-full py-2 flex items-center justify-center">
                Continue as Guest
            </button>

            <p class="text-center text-xs text-gray-400 mt-4">Guest data is saved to this browser only.</p>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-screen" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-white/80 dark:bg-gray-900/80 backdrop-blur-sm">
        <div class="text-center p-6">
            <div class="spinner-dot-flow mb-4">
                <div class="dot dot-1"></div><div class="dot dot-2"></div><div class="dot dot-3"></div>
            </div>
            <p class="text-xl font-semibold text-gray-700 dark:text-gray-200 loading-text">Loading...</p>
        </div>
    </div>

    <!-- Main Application Interface (Hidden until login) -->
    <div id="main-app" class="hidden container mx-auto px-4 py-12 flex-grow">
        <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
             <div class="text-center sm:text-left">
                <h1 class="text-3xl font-bold header-text">Professor Passkey</h1>
                <p class="text-sm sub-text-sm mt-1">Logged in as: <span id="user-email-display" class="font-semibold text-indigo-600">...</span></p>
             </div>
             <div class="flex gap-2">
                 <!-- Updated: Download Feedback Button (Now generates PDF) -->
                 <button onclick="downloadFeedback()" class="btn-secondary text-sm px-4 py-2">📥 Download PDF Feedback</button>
                 <button onclick="signOut()" class="text-red-500 hover:text-red-700 text-sm font-semibold px-4 py-2">Sign Out</button>
             </div>
        </div>

        <!-- Upload Section -->
        <div id="upload-section" class="max-w-2xl mx-auto rounded-xl shadow-2xl border p-8 card-bg card-border">
            <h2 class="text-2xl font-semibold mb-6 flex items-center header-text">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-3-3v6m-4 1v.01m0-4.01m-2.01-4.01h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Document Upload
            </h2>
            
            <input type="file" id="pdf-input" accept=".pdf" class="hidden">
            <div class="space-y-4">
                <button onclick="document.getElementById('pdf-input').click()" class="btn-primary w-full flex items-center justify-center">
                    Choose Document (PDF)
                </button>
                <p id="file-name" class="text-center text-sm min-h-[20px] sub-text-sm">No file selected.</p>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-200 dark:border-gray-700">
                <label class="block text-sm font-medium mb-2 header-text">
                    Difficulty: <span id="difficulty-value" class="font-bold text-indigo-500">5</span>/10
                </label>
                <input type="range" id="difficulty-range" min="1" max="10" value="5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer range-lg" oninput="document.getElementById('difficulty-value').textContent = this.value">
            </div>

            <button id="start-btn" onclick="handlePdfUpload()" class="btn-secondary w-full mt-6 flex items-center justify-center" disabled>
                <span id="start-btn-text">Generate Knowledge Check</span>
                <div id="start-btn-spinner" class="ml-2 hidden spinner-border-sm"></div>
            </button>
        </div>

        <!-- Quiz Section -->
        <div id="quiz-section" class="hidden max-w-2xl mx-auto">
            <div class="rounded-xl shadow-2xl border p-8 card-bg card-border">
                <div class="flex justify-between items-center mb-6 border-b pb-4 border-gray-200 dark:border-gray-700">
                    <span class="text-lg font-semibold sub-text">Question <span id="question-number"></span></span>
                    <span class="text-lg font-semibold text-indigo-600">Score: <span id="score">0</span></span>
                </div>
                <p id="quiz-question" class="text-2xl font-medium mb-8 header-text"></p>
                <div id="quiz-options" class="space-y-3"></div>
                <div id="feedback" class="hidden mt-6 p-4 rounded-lg font-medium"></div>
                <button id="next-btn" onclick="nextQuestion()" class="btn-primary w-full mt-6 hidden">Next Question</button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="results-section" class="hidden max-w-2xl mx-auto rounded-xl shadow-2xl p-8 card-bg card-border">
            <h2 class="text-3xl font-bold text-center mb-4 text-indigo-600">Review Complete!</h2>
            <p class="text-xl text-center mb-6 sub-text">Final Score: <span id="final-score" class="font-bold text-green-600">0</span></p>
            
            <div class="flex gap-4 mb-6">
                <button onclick="downloadFeedback()" class="btn-secondary flex-1 text-sm">📥 Download PDF</button>
                <button onclick="resetApp()" class="btn-primary flex-1 text-sm">Create Another Quiz</button>
            </div>

            <div class="mt-8 border-t pt-6 border-gray-200 dark:border-gray-700">
                <button onclick="showProgress()" class="w-full py-2 text-gray-500 hover:text-indigo-500 text-sm font-medium transition-colors">View Past Progress</button>
                <div id="progress-container" class="hidden mt-4 space-y-3"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
